# TODO CBR: 每次发版前检查模块版本号
# 版本号在.env文件中定义

services:
  xianlai-gateway:
    image: wyatt6/xianlai-gateway:${XIANLAI_GATEWAY_VERSION}
    container_name: xianlai-gateway
    restart: on-failure:5
    volumes:
      - ./xianlai-gateway/application-run.yml:/app/application-run.yml:rw
      - ./xianlai-gateway/log:/app/log:rw
    networks:
      - xianlai_net
    ports:
      - "30000:30000"
  xianlai-system:
    image: wyatt6/xianlai-system:${XIANLAI_SYSTEM_VERSION}
    container_name: xianlai-system
    restart: on-failure:5
    volumes:
      - ./xianlai-system/application-run.yml:/app/application-run.yml:rw
      - ./xianlai-system/log:/app/log:rw
    networks:
      - xianlai_net
    ports:
      - "30001:30001"
  xianlai-plugin-toolkit:
    image: wyatt6/xianlai-plugin-toolkit:${XIANLAI_PLUGIN_TOOLKIT_VERSION}
    container_name: xianlai-plugin-toolkit
    restart: on-failure:5
    volumes:
      - ./xianlai-plugin-toolkit/application-run.yml:/app/application-run.yml:rw
      - ./xianlai-plugin-toolkit/log:/app/log:rw
    networks:
      - xianlai_net
    ports:
      - "30003:30003"

networks:
  xianlai_net:
    external: true
